name: Keepalive

# GitHub disables scheduled workflows after 60 days without repository activity.
# Re-enabling the ingest workflow monthly keeps the cron alive without commits.
on:
  schedule:
    - cron: "41 3 1 * *"
  workflow_dispatch:

permissions:
  actions: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/ingest.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
