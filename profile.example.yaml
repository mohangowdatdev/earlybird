# Copy to profile.yaml (gitignored) and edit. Everything personal lives here, never in code.
# Schema finalised in Phase 2; see docs/matching.md.

name: Example Person
role_families:            # matched against titles
  - data engineer
  - analytics engineer
  - machine learning engineer
  - ai engineer
yoe: 7                    # tolerance -1/+2 applied automatically
skills:                   # matched against descriptions
  must: [python, sql, spark]
  nice: [airflow, dbt, kafka, aws, gcp, llm]
location:
  country: IN
  accept_remote: [remote_india_ok, remote_unspecified, unknown]
  downrank_remote: [remote_restricted]
  hybrid_cities: []       # e.g. [Bangalore]; empty = remote-only
excludes:
  title_patterns: [intern, new grad, director, vice president, "head of"]
  functions: [sales, recruiting, legal]
watchlist:                # Perch: always shown, bypass scoring
  - example-company-slug
chirp:
  daily_cap: 5
