name: Ingest

on:
  schedule:
    - cron: "17 */2 * * *"   # every 2 hours, off the top of the hour
  workflow_dispatch:

permissions:
  contents: write   # upload release assets

concurrency:
  group: ingest
  cancel-in-progress: false

env:
  TAG: data-latest
  GH_TOKEN: ${{ github.token }}
  # Small-model extraction (ADR 0016). Optional: if it fails, ingest uses rules only.
  OLLAMA_VERSION: v0.40.6
  EARLYBIRD_LLM_PROVIDER: ollama
  EARLYBIRD_LLM_MODEL: qwen2.5:3b
  EARLYBIRD_LLM_TIME_BUDGET_SECONDS: "1500"
  EARLYBIRD_LOG_FORMAT: json

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - run: uv sync --locked --no-dev

      - name: Restore previous state
        run: |
          mkdir -p var dist
          if gh release download "$TAG" -p state.db.gz -D var --clobber; then
            gunzip -f var/state.db.gz
            cp var/state.db dist/state.prev.db && gzip -9 -f dist/state.prev.db
          else
            echo "No previous state; starting fresh."
          fi

      - name: Restore model weights
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.ollama/models
          key: ollama-${{ env.EARLYBIRD_LLM_MODEL }}

      - name: Restore model work queue
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: var/llm_queue.db
          key: llm-queue-${{ github.run_id }}
          restore-keys: llm-queue-

      - name: Start Ollama
        continue-on-error: true
        run: |
          curl -fsSL "https://github.com/ollama/ollama/releases/download/${OLLAMA_VERSION}/ollama-linux-amd64.tar.zst" \
            | sudo tar --zstd -x -C /usr/local
          (ollama serve > /tmp/ollama.log 2>&1 &)
          for _ in $(seq 1 30); do curl -sf localhost:11434/api/tags >/dev/null && break; sleep 1; done
          ollama pull "$EARLYBIRD_LLM_MODEL"

      - name: Ingest
        run: uv run earlybird ingest --db var/state.db 2> >(tee "$RUNNER_TEMP/ingest.log" >&2)

      - name: Save model work queue
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: var/llm_queue.db
          key: llm-queue-${{ github.run_id }}

      - name: Build dataset
        run: uv run earlybird publish --db var/state.db --out dist

      - name: Publish to data-latest release
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" \
            --title "Dataset (rolling)" --prerelease --target "$GITHUB_SHA" \
            --notes "Rolling public dataset, overwritten every run. See docs/data-model.md."
          gh release upload "$TAG" dist/* --clobber

      - name: Health summary
        if: always()
        run: |
          {
            echo "## Model refinement"
            grep -h '"llm\.' "$RUNNER_TEMP"/ingest.log 2>/dev/null || echo "no model stats"
            echo "## Source health"
            echo '```json'
            cat dist/health.json 2>/dev/null || echo "no health.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
