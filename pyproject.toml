[project]
name = "earlybird"
version = "0.1.0.dev0"
description = "The early bird gets the job. Every new role from company career pages, filtered to you, the morning it opens."
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "Mohan Gowda T", email = "mohangowdat.dev@gmail.com" }]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.146.0",
    "honcho>=2.0.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.1.5",
    "structlog>=26.1.0",
    "tenacity>=9.2.1",
    "typer>=0.27.3",
    "uvicorn>=0.54.0",
]

[project.scripts]
earlybird = "earlybird.cli:app"

[project.urls]
Repository = "https://github.com/mohangowdatdev/earlybird"

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "N", "S", "PTH", "TRY", "DTZ", "PL"]
ignore = ["PLR0913", "TRY003", "RUF001"]  # en dashes are real data in job text

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004"]

[tool.mypy]
strict = true
python_version = "3.13"
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

[tool.importlinter]
root_package = "earlybird"

[[tool.importlinter.contracts]]
name = "Public plane never imports the private plane (ADR 0013)"
type = "forbidden"
source_modules = [
    "earlybird.core",
    "earlybird.db",
    "earlybird.adapters",
    "earlybird.health",
    "earlybird.discovery",
    "earlybird.enrich",
    "earlybird.publish",
    "earlybird.ingest",
]
forbidden_modules = ["earlybird.private", "earlybird.notify", "earlybird.portal"]

[dependency-groups]
dev = [
    "check-jsonschema>=0.38.2",
    "import-linter>=2.15",
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "ruff>=0.17.1",
    "types-pyyaml>=6.0.12.20260906",
]
