# Skills taxonomy: category -> canonical tag -> aliases.
# Matched case-insensitively on word boundaries against titles and descriptions.
# Aliases prefixed with `=` are case-sensitive (for names that are also everyday words, e.g. =Go);
# a tag with such an alias is not matched by its bare lowercase name.
# Tags must be unique across categories. Bump EXTRACTOR_VERSION in rules.py after edits so
# existing jobs are re-tagged on the next ingest.

