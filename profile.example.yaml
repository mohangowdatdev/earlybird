# Example profile. The easy way: run `make up` and use the profile builder at
# http://127.0.0.1:8765/profile. It writes profile.yaml (gitignored) in this same shape.
name: Example Person
yoe: 7                         # tolerance -1/+2 is applied automatically
role_families:                 # matched against job titles
  - data engineer
  - analytics engineer
  - machine learning engineer
skills_must: [python, sql, spark]
skills_nice: [airflow, dbt, kafka, aws, llm]
remote_types:                  # accepted work arrangements
  - remote_india_ok
  - remote_unspecified
  - unknown
cities: []                     # hybrid/onsite acceptable cities, e.g. [bangalore, bengaluru]
seniorities: []                # preferred levels (junior, mid, senior, staff_plus, ...); empty = any
exclude_title_patterns: [intern, internship, new grad, director, vice president, vp, head of, chief, sales, recruiter]
watchlist: []                  # Perch: company slugs from registry/companies.yaml
min_salary_usd: null
chirp_daily_cap: 5
